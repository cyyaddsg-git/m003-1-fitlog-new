<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fitlog-Koala</title>
<style>
  :root { --bg: #08090b; --fg: #f7f3ea; --muted: #a8a196; --warm: #f4b84e; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f2eb; --fg: #171717; --muted: #665f55; --warm: #c98a1c; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 16px; box-sizing: border-box; }
  .koala { font-size: 64px; line-height: 1; }
  h1 { font-size: 28px; margin: 20px 0 8px; letter-spacing: 0.02em; }
  h1 span { color: var(--warm); }
  p { margin: 0; color: var(--muted); font-size: 17px; }
</style>
</head>
<body>
  <main>
    <div class="koala" aria-hidden="true">🐨</div>
    <h1>Renovating<span>…</span></h1>
    <p>Come back soon. Stay tuned.</p>
  </main>
</body>
</html>
